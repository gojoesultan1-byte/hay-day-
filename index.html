<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجتمع هاي داي - المنصة المتكاملة</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333333;
            --primary-color: #2c3e50;
            --card-bg: #ffffff;
            --accent-color: #27ae60;
            --danger-color: #c0392b;
        }

        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: 0.3s;
        }

        header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-title-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .my-chats-badge {
            font-size: 14px;
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .my-chats-badge:hover {
            background: rgba(255,255,255,0.3);
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }

        .search-bar {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: #e0e0e0;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            margin-bottom: 15px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .pinned-ticker {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            width: 85%;
            max-width: 750px;
            max-height: 85vh;
            border-radius: 10px;
            padding: 25px;
            overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            position: relative;
        }

        .close-modal-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            float: left;
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title-area">
            <h1 style="margin:0; font-size: 22px;">مجتمع هاي داي</h1>
            <span class="my-chats-badge" onclick="openMyChatsModal()">محادثاتي</span>
        </div>
        <div>
            <span id="user-display-info" style="margin-left: 15px; font-weight: bold;"></span>
            <button class="btn" id="auth-btn" onclick="toggleAuthModal()" style="background:#e67e22;">تسجيل / دخول</button>
        </div>
    </header>

    <div class="container">
        <!-- شريط البحث العام -->
        <input type="text" id="global-search" class="search-bar" placeholder="ابحث عن قناة أو جروب معين..." oninput="filterContent()">

        <!-- التبويبات الرئيسية -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('groups')">الجروبات</button>
            <button class="tab-btn" onclick="switchTab('channels')">القنوات</button>
            <button class="tab-btn hidden" id="admin-tab-btn" onclick="switchTab('admin')">لوحة المشرف العام</button>
        </div>

        <!-- محتوى الجروبات -->
        <div id="tab-groups" class="tab-content">
            <button class="btn" onclick="openCreateGroupModal()" style="margin-bottom: 20px;">إنشاء جروب جديد</button>
            <div id="groups-list"></div>
        </div>

        <!-- محتوى القنوات -->
        <div id="tab-channels" class="tab-content hidden">
            <button class="btn" onclick="openCreateChannelModal()" style="margin-bottom: 20px;">إنشاء قناة جديدة</button>
            <div id="channels-list"></div>
        </div>

        <!-- لوحة المشرف العام -->
        <div id="tab-admin" class="tab-content hidden">
            <h2>لوحة التحكم والمراجعة العامة</h2>
            <hr>
            <h3>الجروبات قيد الانتظار للمراجعة</h3>
            <div id="admin-pending-groups"></div>
            
            <h3 style="margin-top: 30px;">قسم الرشق (زيادة متابعين القنوات)</h3>
            <div class="card">
                <select id="rush-channel-select"></select>
                <input type="number" id="rush-amount" placeholder="عدد المتابعين المراد إضافتهم">
                <button class="btn" onclick="executeRush()" style="background: #8e44ad;">تنفيذ الرشق</button>
            </div>
        </div>
    </div>

    <!-- نافذة غرفة الجروب الداخلية والشات والأدوات -->
    <div id="room-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeRoom()">إغلاق</button>
            <h2 id="room-title" style="margin-top:0;">عنوان الجروب</h2>
            <p id="room-desc" style="color: #666;"></p>
            <div id="room-meta"></div>
            <hr style="margin: 15px 0;">

            <!-- شريط الرسائل المثبتة -->
            <div id="pinned-messages-container"></div>

            <!-- صندوق الشات الخاص بالجروب -->
            <div id="room-chat-box" style="height: 280px; overflow-y: auto; border: 1px solid #ddd; padding: 12px; background: #fafafa; border-radius: 6px; margin-bottom: 12px;"></div>

            <div id="chat-input-area">
                <textarea id="message-input" placeholder="اكتب رسالتك هنا... (ممنوع الروابط نهائياً)" rows="2"></textarea>
                <button class="btn" onclick="sendGroupMessage()">إرسال الرسالة</button>
            </div>

            <!-- لوحة إعدادات الجروب للمشرفين والمالك -->
            <div id="group-settings-area" class="hidden" style="margin-top: 25px; border-top: 2px dashed #bdc3c7; padding-top: 15px;">
                <h4 style="margin-top:0; color: #2c3e50;">إعدادات الجروب والخصوصية للمشرفين</h4>
                <label>خصوصية الجروب:</label>
                <select id="setting-privacy" onchange="updateGroupPrivacy()">
                    <option value="public">علني (يظهر في القائمة للجميع)</option>
                    <option value="private">خاص (لا يظهر إلا للمشتركين وأنا)</option>
                </select>
                
                <div style="margin: 10px 0;">
                    <label style="cursor:pointer;"><input type="checkbox" id="setting-close-chat" onchange="toggleChatClose()"> إغلاق المحادثات الخاصة بالجروب نهائياً</label>
                </div>

                <h5 style="margin: 15px 0 5px 0;">ترقية عضو إلى مشرف</h5>
                <select id="promote-user-select"></select>
                <button class="btn" onclick="promoteUserToAdmin()" style="margin-top: 5px; background: #27ae60;">تعيين مشرف جديد</button>
            </div>
        </div>
    </div>

    <!-- نافذة محادثاتي الفردية -->
    <div id="my-chats-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeMyChatsModal()">إغلاق</button>
            <h2 style="margin-top:0;">محادثاتي الفردية (1 لـ 1)</h2>
            <hr>
            <div id="direct-chats-list"></div>
        </div>
    </div>

    <!-- نافذة الشات الفردي والتقييم والحظر -->
    <div id="dm-room-modal" class="modal-overlay hidden">
        <div class="modal-content" style="max-width: 600px;">
            <button class="close-modal-btn" onclick="closeDmRoom()">إغلاق</button>
            <h3 id="dm-partner-name" style="margin-top:0;">محادثة مع</h3>
            
            <div id="dm-actions-bar" style="margin-bottom: 12px; display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn" style="background:#27ae60; font-size:13px; padding:6px 12px;" onclick="addFriend()">إضافة صديق</button>
                <button class="btn" style="background:#c0392b; font-size:13px; padding:6px 12px;" onclick="blockUser()">حظر المستخدم</button>
                <button class="btn" style="background:#f39c12; font-size:13px; padding:6px 12px;" onclick="openRatingModal()">إضافة تقييم (نصاب / مضمون)</button>
            </div>

            <div id="dm-chat-box" style="height: 240px; overflow-y: auto; border: 1px solid #ddd; padding: 12px; background: #fff; border-radius: 6px; margin-bottom: 10px;"></div>
            
            <textarea id="dm-message-input" placeholder="اكتب رسالتك الخاصة هنا..." rows="2"></textarea>
            <button class="btn" onclick="sendDmMessage()">إرسال</button>
        </div>
    </div>

    <script>
        // هيكل قاعدة البيانات الكامل
        let db = JSON.parse(localStorage.getItem('hayday_complete_db')) || {
            users: [], // {username, password, isGlobalAdmin}
            currentUser: null,
            groups: [], // {id, name, desc, img, owner, admins:[], members:[], status:'pending'/'approved', privacy:'public', isClosed:false, pinnedMessages:[], messages:[]}
            channels: [], // {id, name, desc, img, owner, followersCount, link}
            directChats: {} // key: user1_user2 -> [messages]
        };

        const MASTER_ADMIN = "gojoesultan@gmail.com";

        window.onload = function() {
            // ضمان وجود الحساب الأساسي للمشرف العام
            if(!db.users.some(u => u.username === MASTER_ADMIN)) {
                db.users.push({username: MASTER_ADMIN, password: "123", isGlobalAdmin: true});
            }
            checkAuthUI();
            renderGroups();
            renderChannels();
            renderAdminPanel();
        };

        function saveData() {
            localStorage.setItem('hayday_complete_db', JSON.stringify(db));
        }

        // --- نظام المصادقة والأسماء الفريدة وحظر الأسماء المأخوذة ---
        function toggleAuthModal() {
            if(db.currentUser) {
                if(confirm("هل تريد تسجيل الخروج؟")) {
                    db.currentUser = null;
                    saveData();
                    checkAuthUI();
                    renderGroups();
                    renderChannels();
                    renderAdminPanel();
                }
            } else {
                let username = prompt("أدخل اسم المستخدم الفريد (أو البريد الإلكتروني):");
                if(!username) return;
                username = username.trim();

                let existingUser = db.users.find(u => u.username === username);
                if(existingUser) {
                    let pass = prompt("هذا الاسم مسجل مسبقاً. أدخل كلمة المرور الخاصة بحسابك:");
                    if(pass === existingUser.password) {
                        db.currentUser = existingUser.username;
                        alert("تم تسجيل الدخول بنجاح!");
                    } else {
                        alert("كلمة المرور غير صحيحة!");
                        return;
                    }
                } else {
                    // منع أي شخص من استخدام اسم مأخوذ أو مشابه بطريقة خاطئة
                    let pass = prompt("اسم مستخدم جديد. اختر كلمة مرور لتأمين حسابك:");
                    if(!pass) return;
                    
                    db.users.push({
                        username: username,
                        password: pass,
                        isGlobalAdmin: username === MASTER_ADMIN
                    });
                    db.currentUser = username;
                    alert("تم إنشاء الحساب وتسجيل الدخول بنجاح!");
                }
                saveData();
                checkAuthUI();
                renderGroups();
                renderChannels();
                renderAdminPanel();
            }
        }

        function checkAuthUI() {
            let info = document.getElementById('user-display-info');
            let authBtn = document.getElementById('auth-btn');
            let adminTab = document.getElementById('admin-tab-btn');

            if(db.currentUser) {
                info.innerText = `مرحباً: ${db.currentUser}`;
                authBtn.innerText = "تسجيل خروج";
                let userObj = db.users.find(u => u.username === db.currentUser);
                if(userObj && userObj.isGlobalAdmin) {
                    adminTab.classList.remove('hidden');
                } else {
                    adminTab.classList.add('hidden');
                }
            } else {
                info.innerText = "";
                authBtn.innerText = "تسجيل / دخول";
                adminTab.classList.add('hidden');
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            if(tabName === 'groups') {
                document.getElementById('tab-groups').classList.remove('hidden');
                event.target.classList.add('active');
                renderGroups();
            } else if(tabName === 'channels') {
                document.getElementById('tab-channels').classList.remove('hidden');
                event.target.classList.add('active');
                renderChannels();
            } else if(tabName === 'admin') {
                document.getElementById('tab-admin').classList.remove('hidden');
                event.target.classList.add('active');
                renderAdminPanel();
            }
        }

        // --- وظيفة التحقق من الروابط الممنوعة ---
        function containsLink(text) {
            return /(http:\/\/|https:\/\/|www\.|\.com|\.net|\.org|t\.me|wa\.me)/i.test(text);
        }

        // --- إنشاء الجروبات مع الشروط (الاسم إجباري وغير مملوك، الوصف والصورة اختياري، بدون روابط) ---
        function openCreateGroupModal() {
            if(!db.currentUser) { alert("يجب تسجيل الدخول أولاً لإنشاء جروب!"); return; }
            
            let name = prompt("أدخل اسم الجروب (إجباري وممنوع استخدام اسم مملوك مسبقاً):");
            if(!name) return;
            name = name.trim();

            // فحص عدم تكرار الاسم في الجروبات أو القنوات
            let nameExists = db.groups.some(g => g.name === name) || db.channels.some(c => c.name === name);
            if(nameExists) {
                alert("عذراً، هذا الاسم مملوك مسبقاً لقناة أو جروب آخر. يجيب اختيار اسم فريد!");
                return;
            }

            let desc = prompt("أدخل وصف الجروب (اختياري - ممنوع استخدام أي روابط نهائياً):") || "";
            if(containsLink(desc)) {
                alert("ممنوع استخدام الروابط في وصف الجروب!");
                return;
            }

            let img = prompt("أدخل رابط صورة الجروب (اختياري):") || "";

            let newGroup = {
                id: 'g_' + Date.now(),
                name: name,
                desc: desc,
                img: img,
                owner: db.currentUser,
                admins: [db.currentUser],
                members: [db.currentUser],
                status: 'pending', // معلق حتى يراجعه المشرف العام
                privacy: 'public', // افتراضي علني
                isClosed: false,
                pinnedMessages: [],
                messages: []
            };

            db.groups.push(newGroup);
            saveData();
            alert("تم إرسال الجروب بنجاح! بانتظار مراجعة وموافقة المشرف العام لنشره في المجتمع.");
            renderGroups();
        }

        // --- عرض الجروبات (الأعلى هو الأكبر في المشتركين، التعامل مع الـ 1K، والجروبات الخاصة) ---
        function renderGroups() {
            let container = document.getElementById('groups-list');
            let query = document.getElementById('global-search').value.toLowerCase();
            container.innerHTML = '';

            let approvedGroups = db.groups.filter(g => g.status === 'approved');
            // ترتيب الجروبات: الأعلى هو الأكثر مشتركين
            approvedGroups.sort((a,b) => b.members.length - a.members.length);

            approvedGroups.forEach(group => {
                if(query && !group.name.toLowerCase().includes(query) && !group.desc.toLowerCase().includes(query)) return;

                let isMember = db.currentUser && group.members.includes(db.currentUser);
                let isGlobalAdmin = db.users.find(u => u.username === db.currentUser)?.isGlobalAdmin;

                // لو الجروب خاص، لا يظهر إلا للمشتركين والمشرف العام
                if(group.privacy === 'private' && !isMember && !isGlobalAdmin) {
                    return;
                }

                // حساب عدد المشتركين مع صيغة 1K إذا ععدوا الألف
                let countNum = group.members.length;
                let countDisplay = countNum >= 1000 ? (countNum / 1000).toFixed(1) + 'K' : countNum;

                container.innerHTML += `
                    <div class="card">
                        <h3 style="margin-top:0;">${group.name} <span style="font-size:13px; color:#e67e22; font-weight:normal;">(المشتركين: ${countDisplay})</span></h3>
                        <p style="color:#555;">${group.desc || 'بدون وصف'}</p>
                        ${isMember ? 
                            `<button class="btn" onclick="openGroupRoom('${group.id}')">دخول الجروب والشات</button>` : 
                            `<button class="btn" style="background:var(--accent-color);" onclick="joinGroup('${group.id}')">انضمام للجروب</button>`
                        }
                    </div>
                `;
            });
        }

        function joinGroup(groupId) {
            if(!db.currentUser) { alert("يجب تسجيل الدخول أولاً للانضمام!"); return; }
            let group = db.groups.find(g => g.id === groupId);
            if(group && !group.members.includes(db.currentUser)) {
                group.members.push(db.currentUser);
                saveData();
                renderGroups();
                openGroupRoom(groupId);
            }
        }

        // --- غرفة الجروب والرسائل المثبتة (بحد أقصى 7 رسائل والضغط للانتقال السريع) ---
        let activeRoomId = null;

        function openGroupRoom(groupId) {
            let group = db.groups.find(g => g.id === groupId);
            if(!group) return;
            activeRoomId = groupId;

            document.getElementById('room-title').innerText = group.name;
            document.getElementById('room-desc').innerText = group.desc || 'لا يوجد وصف';
            document.getElementById('room-modal').classList.remove('hidden');

            let isMod = group.admins.includes(db.currentUser) || (db.users.find(u => u.username === db.currentUser)?.isGlobalAdmin);
            let settingsArea = document.getElementById('group-settings-area');

            if(isMod) {
                settingsArea.classList.remove('hidden');
                document.getElementById('setting-privacy').value = group.privacy;
                document.getElementById('setting-close-chat').checked = group.isClosed;

                // تعبئة قائمة الأعضاء لترقيتهم لمشرفين
                let promoteSelect = document.getElementById('promote-user-select');
                promoteSelect.innerHTML = '';
                group.members.forEach(m => {
                    if(!group.admins.includes(m)) {
                        promoteSelect.innerHTML += `<option value="${m}">${m}</option>`;
                    }
                });
            } else {
                settingsArea.classList.add('hidden');
            }

            renderPinnedMessages(group);
            renderGroupMessages(group);
        }

        function closeRoom() {
            document.getElementById('room-modal').classList.add('hidden');
            activeRoomId = null;
        }

        function renderPinnedMessages(group) {
            let container = document.getElementById('pinned-messages-container');
            container.innerHTML = '';
            if(group.pinnedMessages && group.pinnedMessages.length > 0) {
                group.pinnedMessages.forEach((msg, idx) => {
                    // استخراج أول كلمة من الرسالة المثبتة
                    let firstWord = msg.text.split(' ')[0] || '';
                    container.innerHTML += `
                        <div class="pinned-ticker" onclick="scrollToMessage(${idx})">
                            <span>📌 <strong>رسالة مثبتة:</strong> ${firstWord}... (${msg.sender})</span>
                            <span style="font-size:12px; color:#2980b9;">اضغط للقراءة</span>
                        </div>
                    `;
                });
            }
        }

        function scrollToMessage(idx) {
            let chatBox = document.getElementById('room-chat-box');
            let targetDiv = document.getElementById(`msg-item-${idx}`);
            if(targetDiv) {
                chatBox.scrollTop = targetDiv.offsetTop - chatBox.offsetTop - 20;
            }
        }

        function renderGroupMessages(group) {
            let chatBox = document.getElementById('room-chat-box');
            chatBox.innerHTML = '';

            let isMod = group.admins.includes(db.currentUser) || (db.users.find(u => u.username === db.currentUser)?.isGlobalAdmin);

            group.messages.forEach((msg, idx) => {
                let canPin = isMod && group.pinnedMessages.length < 7 && !group.pinnedMessages.some(p => p.text === msg.text);
                let pinBtn = canPin ? `<button onclick="pinMessage(${idx})" style="font-size:11px; padding:2px 6px; margin-right:10px; cursor:pointer;">تثبيت</button>` : '';

                chatBox.innerHTML += `
                    <div id="msg-item-${idx}" style="margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:6px;">
                        <strong style="cursor:pointer; color:#2980b9;" onclick="openUserProfile('${msg.sender}')">${msg.sender}:</strong> 
                        <span>${msg.text}</span>
                        ${pinBtn}
                    </div>
                `;
            });
            chatBox.scrollTop = chatBox.scrollHeight;

            // التحقق إذا كان الشات مغلقاً من قبل المشرف
            if(group.isClosed && !isMod) {
                document.getElementById('chat-input-area').classList.add('hidden');
                chatBox.innerHTML += `<p style="color:var(--danger-color); text-align:center; font-weight:bold;">عذراً، محادثات هذا الجروب مغلقة من قبل المشرفين حالياً.</p>`;
            } else {
                document.getElementById('chat-input-area').classList.remove('hidden');
            }
        }

        function sendGroupMessage() {
            if(!db.currentUser) return;
            let group = db.groups.find(g => g.id === activeRoomId);
            if(!group) return;

            let text = document.getElementById('message-input').value.trim();
            if(!text) return;
            if(containsLink(text)) {
                alert("ممنوع وضع أي روابط نهائياً في المحادثة!");
                return;
            }

            group.messages.push({sender: db.currentUser, text: text});
            document.getElementById('message-input').value = '';
            saveData();
            renderGroupMessages(group);
        }

        function pinMessage(msgIndex) {
            let group = db.groups.find(g => g.id === activeRoomId);
            if(!group) return;
            let msg = group.messages[msgIndex];
            
            if(group.pinnedMessages.length < 7) {
                group.pinnedMessages.push(msg);
                saveData();
                renderPinnedMessages(group);
                renderGroupMessages(group);
            } else {
                alert("عذراً، الحد الأقصى للرسائل المثبتة في الجروب هو 7 رسائل فقط!");
            }
        }

        // إعدادات المشرفين داخل الجروب (إغلاق الدردشة، الخصوصية، وترقية مشرفين)
        function updateGroupPrivacy() {
            let group = db.groups.find(g => g.id === activeRoomId);
            if(!group) return;
            group.privacy = document.getElementById('setting-privacy').value;
            saveData();
            alert("تم تحديث خصوصية الجروب بنجاح!");
        }

        function toggleChatClose() {
            let group = db.groups.find(g => g.id === activeRoomId);
            if(!group) return;
            group.isClosed = document.getElementById('setting-close-chat').checked;
            saveData();
            openGroupRoom(group.id);
        }

        function promoteUserToAdmin() {
            let group = db.groups.find(g => g.id === activeRoomId);
            let userToPromote = document.getElementById('promote-user-select').value;
            if(!group || !userToPromote) return;
            
            if(!group.admins.includes(userToPromote)) {
                group.admins.push(userToPromote);
                saveData();
                alert(`تم ترقية ${userToPromote} إلى مشرف في الجروب بنجاح!`);
                openGroupRoom(group.id);
            }
        }

        // --- إدارة القنوات مع الروابط الخاصة وقسم الرشق ---
        function openCreateChannelModal() {
            if(!db.currentUser) { alert("يجب تسجيل الدخول أولاً!"); return; }
            let name = prompt("أدخل اسم القناة (إجباري وممنوع التكرار):");
            if(!name) return;
            name = name.trim();

            let nameExists = db.groups.some(g => g.name === name) || db.channels.some(c => c.name === name);
            if(nameExists) {
                alert("هذا الاسم مملوك مسبقاً!");
                return;
            }

            let desc = prompt("أدخل وصف القناة (اختياري - بدون روابط):") || "";
            let img = prompt("أدخل رابط صورة القناة (اختياري):") || "";
            let customLink = 'https://hayday.comm/channel/' + Date.now();

            let newChannel = {
                id: 'c_' + Date.now(),
                name: name,
                desc: desc,
                img: img,
                owner: db.currentUser,
                followersCount: 1,
                link: customLink,
                messages: []
            };

            db.channels.push(newChannel);
            saveData();
            alert(`تم إنشاء القناة بنجاح!\nرابط قناتك الخاص لمشاركته مع الآخرين:\n${customLink}`);
            renderChannels();
            renderAdminPanel();
        }

        function renderChannels() {
            let container = document.getElementById('channels-list');
            let query = document.getElementById('global-search').value.toLowerCase();
            container.innerHTML = '';

            db.channels.forEach(channel => {
                if(query && !channel.name.toLowerCase().includes(query) && !channel.desc.toLowerCase().includes(query)) return;

                container.innerHTML += `
                    <div class="card">
                        <h3 style="margin-top:0;">📢 ${channel.name} <span style="font-size:13px; color:#e67e22; font-weight:normal;">(المتابعين: ${channel.followersCount})</span></h3>
                        <p style="color:#555;">${channel.desc || 'بدون وصف'}</p>
                        <p style="font-size:12px; color:#2980b9;">رابط القناة الخاص: <code>${channel.link}</code></p>
                        <button class="btn" style="background:var(--accent-color);" onclick="followChannel('${channel.id}')">متابعة القناة</button>
                    </div>
                `;
            });
        }

        function followChannel(channelId) {
            let channel = db.channels.find(c => c.id === channelId);
            if(channel) {
                channel.followersCount++;
                saveData();
                renderChannels();
                alert("تمت متابعة القناة بنجاح!");
            }
        }

        // --- محادثاتي الفردية والشات الفردي (1 لـ 1) والتقييم والحظر ---
        let activeDmUser = null;

        function openUserProfile(username) {
            if(!db.currentUser || db.currentUser === username) return;
            activeDmUser = username;
            document.getElementById('dm-partner-name').innerText = `محادثة فردية مع: ${username}`;
            document.getElementById('dm-room-modal').classList.remove('hidden');
            renderDmMessages();
        }

        function closeDmRoom() {
            document.getElementById('dm-room-modal').classList.add('hidden');
            activeDmUser = null;
        }

        function getDmKey(u1, u2) {
            return [u1, u2].sort().join('_');
        }

        function renderDmMessages() {
            let chatBox = document.getElementById('dm-chat-box');
            chatBox.innerHTML = '';
            let key = getDmKey(db.currentUser, activeDmUser);
            if(!db.directChats[key]) db.directChats[key] = [];

            db.directChats[key].forEach(msg => {
                chatBox.innerHTML += `<div style="margin-bottom:8px;"><strong>${msg.sender}:</strong> ${msg.text}</div>`;
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendDmMessage() {
            if(!db.currentUser || !activeDmUser) return;
            let text = document.getElementById('dm-message-input').value.trim();
            if(!text) return;

            let key = getDmKey(db.currentUser, activeDmUser);
            if(!db.directChats[key]) db.directChats[key] = [];

            db.directChats[key].push({sender: db.currentUser, text: text});
            document.getElementById('dm-message-input').value = '';
            saveData();
            renderDmMessages();
        }

        function addFriend() {
            alert(`تم إرسال طلب صداقة إلى ${activeDmUser} بنجاح!`);
        }

        function blockUser() {
            if(confirm(`هل أنت متأكد من حظر المستخدم ${activeDmUser}؟`)) {
                alert("تم حظر المستخدم ولن تتمكن من مراسلته بعد الآن.");
                closeDmRoom();
            }
        }

        function openRatingModal() {
            let rating = prompt(`أدخل تقييمك للكتابة بحق ${activeDmUser} (مثال: نصاب، مضمون، محترم، صادق...):`);
            if(rating) {
                alert(`تم تسجيل تقييمك بنجاح بحق ${activeDmUser}: "${rating}"`);
            }
        }

        function openMyChatsModal() {
            if(!db.currentUser) { alert("يجب تسجيل الدخول أولاً لعرض محادثاتك!"); return; }
            let list = document.getElementById('direct-chats-list');
            list.innerHTML = '';

            let foundAny = false;
            for(let key in db.directChats) {
                if(key.includes(db.currentUser)) {
                    foundAny = true;
                    let partner = key.split('_').find(u => u !== db.currentUser);
                    list.innerHTML += `
                        <div class="card" style="cursor:pointer; padding:12px; margin-bottom:8px;" onclick="closeMyChatsModal(); openUserProfile('${partner}')">
                            <h4 style="margin:0;">💬 محادثة مع: ${partner}</h4>
                        </div>
                    `;
                }
            }

            if(!foundAny) {
                list.innerHTML = `<p style="color:#666;">لا توجد محادثات فردية سابقة حتى الآن.</p>`;
            }
            document.getElementById('my-chats-modal').classList.remove('hidden');
        }

        function closeMyChatsModal() {
            document.getElementById('my-chats-modal').classList.add('hidden');
        }

        // --- لوحة المشرف العام والمراجعة وقسم الرشق ---
        function renderAdminPanel() {
            let userObj = db.users.find(u => u.username === db.currentUser);
            if(!userObj || !userObj.isGlobalAdmin) return;

            let pendingContainer = document.getElementById('admin-pending-groups');
            pendingContainer.innerHTML = '';

            let pendingGroups = db.groups.filter(g => g.status === 'pending');
            if(pendingGroups.length === 0) {
                pendingContainer.innerHTML = `<p style="color:#666;">لا توجد جروبات تنتظر المراجعة حالياً.</p>`;
            } else {
                pendingGroups.forEach(g => {
                    pendingContainer.innerHTML += `
                        <div class="card" style="background:#fff3cd;">
                            <h4 style="margin-top:0;">${g.name} (بواسطة: ${g.owner})</h4>
                            <p>${g.desc || 'بدون وصف'}</p>
                            <button class="btn" style="background:var(--accent-color);" onclick="approveGroup('${g.id}')">موافقة ونشر</button>
                            <button class="btn" style="background:var(--danger-color);" onclick="rejectGroup('${g.id}')">رفض وحذف</button>
                        </div>
                    `;
                });
            }

            // تعبئة قائمة القنوات للرشق
            let rushSelect = document.getElementById('rush-channel-select');
            rushSelect.innerHTML = '';
            db.channels.forEach(c => {
                rushSelect.innerHTML += `<option value="${c.id}">${c.name} (المتابعين الحاليين: ${c.followersCount})</option>`;
            });
        }

        function approveGroup(groupId) {
            let g = db.groups.find(x => x.id === groupId);
            if(g) {
                g.status = 'approved';
                saveData();
                renderAdminPanel();
                renderGroups();
                alert("تمت الموافقة على نشر الجروب في المجتمع بنجاح!");
            }
        }

        function rejectGroup(groupId) {
            if(confirm("هل أنت متأكد من رفض وحذف هذا الجروب نهائياً؟")) {
                db.groups = db.groups.filter(x => x.id !== groupId);
                saveData();
                renderAdminPanel();
                renderGroups();
            }
        }

        function executeRush() {
            let channelId = document.getElementById('rush-channel-select').value;
            let amount = parseInt(document.getElementById('rush-amount').value);
            if(!channelId || isNaN(amount) || amount <= 0) {
                alert("يرجى اختيار قناة وتحديد عدد صحيح وموجب للرشق!");
                return;
            }

            let channel = db.channels.find(c => c.id === channelId);
            if(channel) {
                channel.followersCount += amount;
                saveData();
                renderAdminPanel();
                renderChannels();
                alert(`تم تنفيذ الرشق بنجاح وتمت إضافة ${amount} متابع للقناة!`);
            }
        }

        function filterContent() {
            renderGroups();
            renderChannels();
        }
    </script>
</body>
</html>
